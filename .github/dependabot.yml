version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /nextjs
    schedule:
      interval: weekly
    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
  - package-ecosystem: pip
    directory: /fastapi
    schedule:
      interval: weekly
