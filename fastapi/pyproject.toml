[project]
name = "taskforge-api"
version = "0.1.0"
description = "TaskForge Project Management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "PyJWT>=2.10.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "editables==0.5",
    "hatchling==1.27.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.1.5",
    "httpx2>=2.0.0",
    "pip-audit>=2.7.3",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
env = ["SECRET_KEY=test-only-taskforge-secret-key-never-use-in-production"]
filterwarnings = [
    "error",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["app"]

[tool.coverage.report]
fail_under = 99.9
show_missing = true
skip_covered = true
